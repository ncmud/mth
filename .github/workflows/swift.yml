name: Swift

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Swift
      if: runner.os == 'Windows'
      uses: SwiftyLab/setup-swift@latest
    - name: Build
      run: swift build -v
    - name: Test
      run: swift test -v
